name: Buffer status
on:
  push:
    paths: ["buffer/pedido-status.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta canais (somente leitura)
        env:
          KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,datetime
          def q(query,variables=None):
              r=urllib.request.Request("https://api.buffer.com",data=json.dumps({"query":query,"variables":variables or {}}).encode(),headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ.get("KEY","")})
              try: return json.load(urllib.request.urlopen(r,timeout=30))
              except urllib.error.HTTPError as e: return {"http_error":e.code,"body":e.read().decode()[:300]}
          out={"quando":datetime.datetime.utcnow().isoformat()+"Z","chave_presente":bool(os.environ.get("KEY"))}
          a=q("query{ account { organizations { id name } } }"); out["account"]=a
          try:
              org=a["data"]["account"]["organizations"][0]["id"]
              c=q("query($o:OrganizationId!){ channels(input:{organizationId:$o}){ id name service } }",{"o":org}); out["channels"]=c
          except Exception as e: out["erro"]=str(e)[:200]
          os.makedirs("buffer",exist_ok=True); json.dump(out,open("buffer/status.json","w"),ensure_ascii=False,indent=1)
          PY
      - name: Salva resultado
        run: |
          git config user.name "escritorio-bot"; git config user.email "bot@users.noreply.github.com"
          git add buffer/status.json && git commit -m "Buffer status" && git push || true
